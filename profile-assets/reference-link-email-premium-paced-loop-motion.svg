<svg xmlns="http://www.w3.org/2000/svg" width="220" height="43" viewBox="0 0 220 43"><style>
  @keyframes appear { 0%,100% { opacity: .96; } 50% { opacity: 1; } }
  @keyframes rise { 0%,100% { transform: scaleY(.96); } 50% { transform: scaleY(1); } }
  @keyframes expand { 0%,100% { transform: scaleX(.98); } 50% { transform: scaleX(1); } }
  .motion-language { transform-box: fill-box; transform-origin: left center; animation: expand 14s ease-in-out infinite; }
  .motion-donut { animation: appear 14s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity: .9; } 50% { opacity: 1; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
  @keyframes turn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes sail { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(1deg); } }
  .wheel-spin { transform-origin: 0px 0px; animation: turn 60s linear infinite; }
  .pirate-flag { transform-box: fill-box; transform-origin: left center; animation: sail 12s ease-in-out infinite; }
  .motion-bar { transform-box: fill-box; transform-origin: center bottom; animation: rise 14s ease-in-out infinite; }
  .motion-line { animation: appear 14s ease-in-out infinite; }
  .motion-ring { animation: appear 14s ease-in-out infinite; }
  .motion-cell { animation: appear 12s ease-in-out infinite; animation-delay: var(--delay,0ms); }
  .motion-icon { animation: glow 12s ease-in-out infinite; }
  .motion-logo { animation: float 12s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style><rect x="1" y="1" width="218" height="41" rx="21" fill="#161B2F" stroke="#B51A2B" stroke-width="1.5"/><g transform="translate(30 11) scale(0.875)" fill="none" stroke="#FFA586" class="motion-icon" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m3 6 9 7 9-7"/></g><text x="127" y="27" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#EDF1F7" font-weight="700">EMAIL</text></svg>
